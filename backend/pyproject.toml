[project]
name = "findcar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1", "uvicorn==0.52.4", "SQLAlchemy==2.0.52",
  "alembic==1.19.2", "psycopg[binary]==3.3.5", "pydantic==2.13.5",
  "pydantic-settings==2.15.0", "argon2-cffi==25.1.0", "httpx==0.28.1",
  "Pillow==12.3.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.6", "mypy==2.3.1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.sources.mock" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
exclude = ["migrations", "tests"]
