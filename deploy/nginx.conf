# Example for testerio.ru with its existing Certbot certificate.
# Enable this site only after backing up/disabling the previous virtual host.
server {
    listen 80;
    server_name testerio.ru www.testerio.ru;
    return 301 https://testerio.ru$request_uri;
}

server {
    listen 443 ssl;
    server_name www.testerio.ru;
    ssl_certificate /etc/letsencrypt/live/testerio.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/testerio.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://testerio.ru$request_uri;
}

server {
    listen 443 ssl;
    server_name testerio.ru;
    server_tokens off;
    client_max_body_size 64k;
    ssl_certificate /etc/letsencrypt/live/testerio.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/testerio.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
