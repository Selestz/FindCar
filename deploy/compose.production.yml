# Use with the base compose file from the project root.
x-runtime: &runtime
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *runtime
  backend:
    <<: *runtime
  worker:
    <<: *runtime
  frontend:
    <<: *runtime
